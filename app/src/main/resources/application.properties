spring.application.name=back-end

# Secrets are loaded from the repo-root .env file via spring-dotenv (see pom.xml).
# Copy .env.example to .env and fill in your local values.
# Dotenv location is configured in src/main/resources/.env.properties.

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mydb?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/my_mongo_db}

management.endpoint.health.show-details=always
management.health.db.enabled=true


api.path=/
jwt.secret=${JWT_SECRET:}



spring.web.resources.static-locations=classpath:/static/

# -------------------------
# Thymeleaf Configuration
# -------------------------
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false    
spring.thymeleaf.encoding=UTF-8